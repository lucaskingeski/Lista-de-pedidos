<!-- Especificacao: docs/plans/2026-10-13-adivinha-palavra.md (PRD v3.0).
     As citacoes "PRD §x" nos comentarios deste arquivo apontam para la.

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0A1F">
<title>Adivinha Palavra — Elétrico</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   ADIVINHA PALAVRA · DIREÇÃO DE ART "ELÉTRICO"
   Arcade neon premium: marinho profundo + auroras roxo/magenta/rosa,
   vidro fosco, tipografia 900 com gradiente e brilho de neon como feedback.
   Regra de ouro do projeto: A COR NUNCA TRABALHA SOZINHA.
   Todo estado tem TRÊS codificações simultâneas:
     1) cor, 2) forma (anel simples / anel duplo / sem anel) + textura, 3) glifo (✓ ~ ✕).
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. TOKENS ─────────────────────────────────────────────────────────── */
:root{
  /* Superfícies */
  --void:#0B0A1F;
  --void-2:#12102E;
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.085);
  --hair:rgba(255,255,255,.13);

  /* Auroras da identidade */
  --violet:#7C3AED;
  --magenta:#D946EF;
  --pink:#EC4899;

  /* Feedback luminoso */
  --neon-green:#22C55E;
  --neon-yellow:#EAB308;
  --neon-cold:#8CA3C4;      /* cinza-azulado do estado "ausente" — claro o bastante p/ 4.5:1 */
  --neon-cyan:#67E8F9;      /* chrome de UI (foco), fora da família de marca */

  /* Tinta */
  --ink:#F4F2FF;
  --ink-2:#C3BCE6;
  --ink-3:#928CBB;

  /* Tipografia */
  --f-display:"Arial Black","Arial Bold",Impact,Haettenschweiler,"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;

  /* Ritmo */
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

/* ── 2. RESET ──────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:var(--void);
  color:var(--ink);
  font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* Autores com `display` explícito (ex.: .reveal-word{display:inline-flex})
   VENCEM o `[hidden]{display:none}` do user-agent. Sem isto, esconder
   elementos por atributo deixaria "pílulas" fantasma no modal. */
[hidden]{display:none !important}
:focus{outline:none}
/* Foco visível e com两层: anel claro + halo violeta. Nunca some. */
:focus-visible{outline:3px solid var(--neon-cyan);outline-offset:3px;border-radius:6px;z-index:5;position:relative}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ── 3. FUNDO: três auroras + grade técnica + vinheta ─────────────────── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(120% 80% at 50% -10%, #16123A 0%, var(--void) 58%, #07061A 100%)}
.aurora{position:absolute;border-radius:50%;filter:blur(78px);will-change:transform}
.aurora--v{width:min(118vw,780px);aspect-ratio:1;left:-26vw;top:-30vh;
  background:radial-gradient(circle,rgba(124,58,237,.58),transparent 62%);animation:drift 27s ease-in-out infinite alternate}
.aurora--m{width:min(110vw,720px);aspect-ratio:1;right:-26vw;top:2vh;
  background:radial-gradient(circle,rgba(217,70,239,.44),transparent 64%);animation:drift 34s ease-in-out infinite alternate-reverse}
.aurora--p{width:min(132vw,860px);aspect-ratio:1;left:6vw;bottom:-44vh;
  background:radial-gradient(circle,rgba(236,72,153,.36),transparent 66%);animation:drift 42s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(5vw,-3vh,0) scale(1.14)}}
/* Grade técnica de 1px: dá "osciloscópio" sem competir com o texto. */
.bg__grid{position:absolute;inset:-2px;
  background-image:
    linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 78% 62% at 50% 26%,#000 12%,transparent 78%);
  mask-image:radial-gradient(ellipse 78% 62% at 50% 26%,#000 12%,transparent 78%)}
.bg__vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,transparent 40%,rgba(4,3,16,.72) 100%)}

/* ── 4. DETALHE ASSINATURA: barra de ENERGIA no topo ───────────────────── */
/* Fina (5px), gradiente violeta→magenta→rosa→âmbar, com cabeça luminosa
   e um sweep contínuo: é o "medidor de carga" da partida. */
.energy{position:fixed;top:0;left:0;right:0;height:5px;z-index:60;
  background:rgba(255,255,255,.055);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.energy__fill{position:relative;height:100%;width:var(--charge,0%);border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--violet),var(--magenta) 42%,var(--pink) 70%,var(--neon-yellow));
  box-shadow:0 0 14px rgba(217,70,239,.9),0 0 34px -4px rgba(236,72,153,.65);
  transition:width .62s var(--ease-out)}
/* cabeça luminosa: o ponto que "acende" a cada avanço */
.energy__fill::after{content:'';position:absolute;right:-3px;top:50%;translate:0 -50%;
  width:7px;height:7px;border-radius:50%;background:#FFF7ED;box-shadow:0 0 12px 2px rgba(255,255,255,.85)}
.energy__shine{position:absolute;top:0;bottom:0;width:34%;border-radius:inherit;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
  animation:sweep 2.8s linear infinite;mix-blend-mode:screen}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.energy__ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.energy__ticks i{flex:1;border-right:1px solid rgba(11,10,31,.75)}
.energy__ticks i:last-child{border:0}

/* ── 5. CABEÇALHO ──────────────────────────────────────────────────────── */
.stage{position:relative;z-index:1;width:min(100%,560px);margin-inline:auto;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;align-items:center}

.brand{display:flex;align-items:center;gap:11px;width:100%;justify-content:center}
/* Marca: raio em CSS puro (clip-path), com halo. */
.bolt{position:relative;width:30px;height:40px;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(234,179,8,.65))}
.bolt::before{content:'';position:absolute;inset:0;
  background:linear-gradient(165deg,#FFF7D6,var(--neon-yellow) 34%,var(--pink) 78%);
  clip-path:polygon(58% 0,18% 55%,44% 55%,36% 100%,82% 40%,53% 40%)}
.bolt::after{content:'';position:absolute;inset:-6px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(234,179,8,.35),transparent 68%)}

/* Título: peso 900, tracking negativo e gradiente recortado no texto.
   O brilho usa filter:drop-shadow (text-shadow não funciona com color:transparent). */
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;
  font-size:clamp(19px,5.4vw,25px);letter-spacing:-.045em;line-height:1;
  background:linear-gradient(96deg,#FFF7ED 0%,#E9D5FF 22%,var(--magenta) 58%,var(--pink) 84%,#FBBF24 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 16px rgba(217,70,239,.45))}
.brand h1 span{display:block;font-size:.62em;letter-spacing:.30em;margin-top:5px;
  color:var(--ink-3);-webkit-text-fill-color:var(--ink-3);
  filter:drop-shadow(0 0 8px rgba(124,58,237,.55));font-family:var(--f-ui);font-weight:800}

.tools{margin-left:auto;display:flex;gap:7px}
.chip{min-height:44px;min-width:44px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-2);
  background:var(--glass);border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .18s,box-shadow .3s,color .25s,border-color .25s}
.chip:hover{color:var(--ink);border-color:rgba(217,70,239,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 20px -8px var(--magenta)}
.chip:active{transform:translateY(1px)}
.chip[aria-pressed="true"]{color:#fff;border-color:rgba(34,197,94,.55);
  background:linear-gradient(180deg,rgba(34,197,94,.22),rgba(34,197,94,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 22px -8px var(--neon-green)}
.chip__dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55;box-shadow:0 0 8px currentColor}
.chip[aria-pressed="true"] .chip__dot{opacity:1}

/* ── 6. MASCOTE: LÂMPADA DE CARGA (CSS puro) ──────────────────────────── */
/* A lâmpada é o "medidor de progresso" diegético. Ela carrega conforme as
   tentativas. Vence = incandescente. Perde = queima fria (cinza-azulada). */
.hud{width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 44px -28px #000;
  backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%)}
.bulb{position:relative;flex:0 0 auto;width:58px;height:74px;display:grid;place-items:end center;
  --charge:0;transition:transform .5s var(--ease-spring)}
.bulb.is-on{--charge:1}
.bulb.is-off{--charge:0}
.bulb__halo{position:absolute;left:50%;top:26px;width:96px;height:96px;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(250,204,21,calc(var(--charge)*.30)),rgba(217,70,239,calc(var(--charge)*.20)) 42%,transparent 70%);
  filter:blur(6px);transition:background .5s ease;pointer-events:none}
.bulb__rays{position:absolute;left:50%;top:26px;width:0;height:0;pointer-events:none}
.bulb__rays i{position:absolute;left:-2px;top:-2px;width:4px;height:13px;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,247,214,.95),rgba(234,179,8,0));
  transform:rotate(var(--r)) translateY(-41px);transform-origin:50% 50%;
  opacity:calc(.06 + var(--charge)*.94);
  filter:drop-shadow(0 0 5px rgba(234,179,8,.9));
  transition:opacity .5s ease}
.bulb__glass{position:relative;width:50px;height:50px;display:grid;place-items:center;
  border-radius:50% 50% 44% 44% / 58% 58% 42% 42%;
  background:
    radial-gradient(circle at 36% 28%,rgba(255,255,255,.30),rgba(124,58,237,.16) 42%,rgba(8,7,24,.8) 80%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0));
  box-shadow:inset 0 -9px 20px -7px rgba(217,70,239,.8),inset 0 1px 0 rgba(255,255,255,.35),
    0 0 calc(8px + var(--charge)*30px) rgba(217,70,239,calc(.10 + var(--charge)*.55));
  transition:box-shadow .55s ease}
/* núcleo incandescente — só aparece conforme a carga */
.bulb__glass::after{content:'';width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFFDF0,var(--neon-yellow) 55%,rgba(234,179,8,.1) 78%);
  opacity:calc(var(--charge)*.95);
  box-shadow:0 0 18px 3px rgba(234,179,8,calc(var(--charge)*.6));
  transition:opacity .5s ease}
/* filamento: "U" deitado + haste. Camada fria base + camada quente por opacidade
   (evita color-mix para compatibilidade). */
.bulb__fil{position:relative;width:11px;height:15px;border:2px solid #4A4670;border-top:0;border-radius:0 0 9px 9px;margin-top:6px}
.bulb__fil::before{content:'';position:absolute;left:50%;top:-7px;width:2px;height:8px;background:#4A4670;translate:-50% 0}
.bulb__fil::after{content:'';position:absolute;inset:-2px;border:2px solid var(--neon-yellow);border-top:0;border-radius:0 0 9px 9px;
  box-shadow:0 0 8px rgba(234,179,8,.9);opacity:var(--charge);transition:opacity .5s ease}
.bulb__neck{position:relative;width:22px;height:9px;margin-top:-5px;
  background:linear-gradient(180deg,rgba(124,58,237,.5),rgba(18,16,46,.9));
  clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}
.bulb__base{position:relative;width:30px;height:13px;border-radius:0 0 7px 7px;
  background:repeating-linear-gradient(180deg,#6E6796 0 3px,#332F55 3px 6px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.bulb.is-on .bulb__rays{animation:spin 9s linear infinite}
.bulb.is-on .bulb__glass{animation:bulbBuzz 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bulbBuzz{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.bulb.is-off .bulb__glass{box-shadow:inset 0 -9px 20px -8px rgba(100,116,139,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.bulb.is-off .bulb__fil{filter:grayscale(1)}

.hud__read{flex:1 1 auto;min-width:0}
.hud__label{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.hud__status{margin:5px 0 0;font-size:clamp(14px,3.7vw,16.5px);font-weight:800;line-height:1.28;letter-spacing:-.012em;color:var(--ink)}
.hud__status em{font-style:normal;background:linear-gradient(94deg,var(--neon-green),#86EFAC);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hud__time{flex:0 0 auto;font-family:var(--f-mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink-2);padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid var(--hair)}

/* ── 7. GRADE ──────────────────────────────────────────────────────────── */
/* board = coluna de linhas; cada linha = grid de 5. Mantém grid>row>gridcell
   (semântica ARIA correta) sem fazer o board "enrolar" as linhas em 5 colunas. */
.board{display:flex;flex-direction:column;gap:var(--gap-y);perspective:900px;
  --tile:clamp(46px,15.6vw,62px);--gap-x:clamp(4px,1.5vw,7px);--gap-y:clamp(5px,1.9vw,8px)}
.row{display:grid;grid-template-columns:repeat(5,var(--tile));gap:var(--gap-x);justify-content:center}
.tile{position:relative;width:var(--tile);height:var(--tile);display:grid;place-items:center;border-radius:var(--r-sm);
  background:rgba(255,255,255,.035);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.085);
  transition:box-shadow .28s ease,background .28s ease}
/* "preenchida" neutra — o estado de espera da lâmpada */
.tile[data-state="filled"]{
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.24),inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px -10px #000}
/* STATE: CORRETA — anel simples + halo forte + brilho na letra */
.tile[data-state="correct"]{
  background:linear-gradient(180deg,rgba(34,197,94,.30),rgba(34,197,94,.11));
  box-shadow:inset 0 0 0 2px var(--neon-green),inset 0 0 30px -8px rgba(34,197,94,.9),
    0 0 26px -5px rgba(34,197,94,.62),0 6px 18px -10px #000}
/* STATE: PRESENTE — anel DUPLO (forma distinta) + hachura diagonal + halo âmbar */
.tile[data-state="present"]{
  background:
    repeating-linear-gradient(135deg,rgba(234,179,8,.18) 0 3px,transparent 3px 7px),
    linear-gradient(180deg,rgba(234,179,8,.28),rgba(234,179,8,.10));
  box-shadow:inset 0 0 0 1.5px var(--neon-yellow),inset 0 0 0 4px rgba(234,179,8,.26),
    0 0 24px -6px rgba(234,179,8,.55),0 6px 18px -10px #000}
/* STATE: AUSENTE — sem anel forte, chapado, dessaturado */
.tile[data-state="absent"]{
  background:linear-gradient(180deg,rgba(140,163,196,.11),rgba(140,163,196,.035));
  box-shadow:inset 0 0 0 1.5px rgba(140,163,196,.24)}
/* letra revelada pelo poder: cadeado de luz */
.tile.is-locked::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(103,232,249,.28),transparent 62%);
  box-shadow:inset 0 -3px 0 rgba(103,232,249,.5)}

.tile__glyph{position:relative;z-index:1;font-family:var(--f-display);font-weight:900;
  font-size:clamp(20px,6.2vw,27px);line-height:1;letter-spacing:.01em;color:var(--ink);
  transition:color .28s ease}
.tile[data-state="correct"] .tile__glyph{color:#F0FFF4;text-shadow:0 0 4px rgba(255,255,255,.75),0 0 16px rgba(34,197,94,.95),0 0 34px rgba(34,197,94,.55)}
.tile[data-state="present"] .tile__glyph{color:#FEF9C3;text-shadow:0 0 4px rgba(255,255,255,.7),0 0 16px rgba(234,179,8,.9),0 0 32px rgba(234,179,8,.5)}
.tile[data-state="absent"] .tile__glyph{color:var(--neon-cold);text-shadow:none}

/* Badge de forma: 3ª codificação além da cor. */
.tile__mark{position:absolute;z-index:2;right:4px;bottom:3px;font-size:10px;font-weight:900;line-height:1;opacity:.9}
.tile[data-state="correct"] .tile__mark{color:#BBF7D0}
.tile[data-state="present"] .tile__mark{color:#FDE68A}
.tile[data-state="absent"] .tile__mark{color:#93A6C2;opacity:.75}

/* ASSINATURA DE MOTION: flip + escala em cascata de 80ms por letra.
   O "véu" (::after) cobre o tile neutro e some aos 160ms do flip —
   é assim que o Wordle realmente revela. Cores entram prontas por baixo. */
.tile.flip{animation:flipPop .42s var(--ease-out) var(--d,0ms) both}
.tile.flip::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.24);
  opacity:0;animation:veil .22s linear calc(var(--d,0ms) + 150ms) backwards}
@keyframes flipPop{
  0%{transform:rotateX(-88deg) scale(.82);opacity:.2;filter:blur(2px)}
  58%{transform:rotateX(14deg) scale(1.07);opacity:1;filter:blur(0)}
  100%{transform:rotateX(0) scale(1);opacity:1;filter:blur(0)}
}
@keyframes veil{from{opacity:1}to{opacity:0}}
/* Pulso de "energia" na letra — só 2 batidas, depois volta ao repouso. */
.tile[data-state="correct"] .tile__glyph{animation:charge .82s ease-in-out calc(var(--d,0ms) + 380ms) 2 both}
.tile[data-state="present"] .tile__glyph{animation:chargeSoft .82s ease-in-out calc(var(--d,0ms) + 380ms) 2 both}
@keyframes charge{0%,100%{filter:brightness(1)}50%{filter:brightness(1.7) saturate(1.2)}}
@keyframes chargeSoft{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}

/* Tentativa inválida */
.row.is-bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ── 8. PODERES ────────────────────────────────────────────────────────── */
.powers{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.power{position:relative;overflow:hidden;min-height:56px;padding:9px 13px;border-radius:var(--r-md);
  display:flex;align-items:center;gap:10px;text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.13);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .18s,box-shadow .35s,opacity .3s,filter .3s}
.power__txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.power__txt b{font-family:var(--f-display);font-weight:900;font-size:13px;letter-spacing:.01em;color:var(--ink)}
.power__txt small{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.power__badge{margin-left:auto;flex:0 0 auto;font-family:var(--f-mono);font-size:9.5px;font-weight:700;
  padding:3px 6px;border-radius:5px;color:var(--ink-3);background:rgba(0,0,0,.4);border:1px solid var(--hair)}
/* Ícones 100% CSS no formato de "keycap" — amarram os poderes ao teclado. */
.power__icon{position:relative;flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
/* Revelar = olho */
.power__icon--eye::before{content:'';position:absolute;left:6px;top:10px;width:20px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:var(--ink);clip-path:ellipse(50% 46% at 50% 50%)}
.power__icon--eye::after{content:'';position:absolute;left:12px;top:12.5px;width:9px;height:9px;border-radius:50%;
  background:var(--void);box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
/* Eliminar = círculo cortado (glifo "proibido") */
.power__icon--ban::before{content:'';position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;
  box-shadow:inset 0 0 0 2.5px var(--ink)}
.power__icon--ban::after{content:'';position:absolute;left:7px;top:15px;width:18px;height:2.5px;border-radius:2px;
  background:var(--ink);transform:rotate(-45deg);transform-origin:50% 50%}
.power.is-ready{animation:ready 2.6s ease-in-out infinite}
.power.is-ready .power__icon{box-shadow:inset 0 0 0 1.5px rgba(217,70,239,.85),0 0 18px -4px rgba(217,70,239,.95)}
@keyframes ready{0%,100%{box-shadow:inset 0 0 0 1px rgba(217,70,239,.45),inset 0 1px 0 rgba(255,255,255,.13),0 0 22px -10px rgba(217,70,239,.9)}
  50%{box-shadow:inset 0 0 0 1px rgba(236,72,153,.85),inset 0 1px 0 rgba(255,255,255,.2),0 0 34px -8px rgba(217,70,239,1)}}
.power:hover:not(:disabled){transform:translateY(-2px)}
.power:active:not(:disabled){transform:translateY(1px)}
.power:disabled{opacity:.46;filter:grayscale(.65);cursor:not-allowed}
.power.is-spent{opacity:.5;filter:grayscale(.6)}

/* ── 9. BOTÕES + RIPPLE ────────────────────────────────────────────────── */
.btn{position:relative;overflow:hidden;min-height:48px;padding:0 22px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--f-display);font-weight:900;font-size:14px;letter-spacing:.01em;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 22px -14px #000;
  transition:transform .18s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 28px -10px var(--magenta)}
.btn:active{transform:translateY(1px)}
.btn--primary{--rip:rgba(34,197,94,.5);color:#F0FFF4;border-color:rgba(34,197,94,.55);
  background:linear-gradient(180deg,rgba(34,197,94,.36),rgba(34,197,94,.14));
  box-shadow:inset 0 0 0 1px rgba(34,197,94,.4),inset 0 1px 0 rgba(255,255,255,.22),0 0 30px -12px var(--neon-green)}
.btn--primary:hover{box-shadow:inset 0 0 0 1px rgba(34,197,94,.7),inset 0 1px 0 rgba(255,255,255,.3),0 0 40px -10px var(--neon-green)}
.btn--ghost{--rip:rgba(217,70,239,.42)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);
  background:radial-gradient(circle,var(--rip,rgba(255,255,255,.5)),transparent 68%);
  animation:rip .62s var(--ease-out) forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* ── 10. TECLADO ───────────────────────────────────────────────────────── */
.kb{width:100%;display:flex;flex-direction:column;gap:clamp(4px,1.4vw,7px)}
.kb__row{display:flex;gap:clamp(3px,1vw,6px);justify-content:center}
.kb__row:nth-child(2){width:91%}
.key{position:relative;overflow:hidden;flex:1 1 0;min-width:0;min-height:46px;border-radius:9px;
  display:grid;place-items:center;
  font-family:var(--f-display);font-weight:900;font-size:clamp(12px,3.3vw,15px);letter-spacing:.04em;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.115),rgba(255,255,255,.038));
  border:1px solid rgba(255,255,255,.17);
  box-shadow:0 3px 0 rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.20);
  transition:transform .09s,box-shadow .2s,background .28s,color .28s,opacity .28s}
/* Lip 3D: dá o tactile de arcade keycap */
.key:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.2)}
.key--wide{flex:1.5 1 0;min-height:46px;padding:0 2px;white-space:nowrap;
  /* Tracking apertado: a 360px a tecla larga tem ~44px e "ENTER" com .10em
     era cortado ("ENTE"). Tamanho/tracking fluem juntos. */
  font-size:clamp(8px,2.4vw,12px);letter-spacing:.03em;color:var(--ink-2)}
.key[data-state="correct"]{color:#F0FFF4;background:linear-gradient(180deg,rgba(34,197,94,.55),rgba(34,197,94,.26));
  border-color:rgba(34,197,94,.85);box-shadow:0 0 22px -6px rgba(34,197,94,.95),0 3px 0 rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28);
  text-shadow:0 0 12px rgba(34,197,94,.9)}
.key[data-state="present"]{color:#FEF9C3;background:linear-gradient(180deg,rgba(234,179,8,.52),rgba(234,179,8,.24));
  border-color:rgba(234,179,8,.85);box-shadow:0 0 22px -6px rgba(234,179,8,.9),0 3px 0 rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28);
  text-shadow:0 0 12px rgba(234,179,8,.85)}
.key[data-state="absent"]{color:#93A6C2;background:rgba(255,255,255,.028);border-color:rgba(255,255,255,.07);
  box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);opacity:.6}
/* Letra eliminada pelo poder: barra diagonal por cima (forma ≠ cor) */
.key.is-eliminated::after{content:'';position:absolute;left:-12%;right:-12%;top:50%;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(236,72,153,.95),transparent);transform:rotate(-22deg);
  box-shadow:0 0 10px rgba(236,72,153,.8)}
.key:disabled{cursor:default}

/* ── 11. TOASTS (subem com spring) ─────────────────────────────────────── */
.toasts{position:fixed;left:50%;translate:-50% 0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:80;
  width:min(94vw,430px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{--tc:var(--magenta);--tcb:rgba(217,70,239,.45);
  display:flex;align-items:center;gap:11px;max-width:100%;padding:11px 16px;border-radius:14px;
  font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink);
  background:linear-gradient(180deg,rgba(26,22,58,.94),rgba(14,12,36,.94));
  border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 20px 44px -20px #000,0 0 30px -12px var(--tc);
  animation:toastIn .5s var(--ease-spring) both,toastOut .34s ease-in forwards var(--life,2.5s)}
.toast[data-kind="error"]{--tc:#FB7185;--tcb:rgba(251,113,133,.5)}
.toast[data-kind="success"]{--tc:var(--neon-green);--tcb:rgba(34,197,94,.5)}
.toast[data-kind="info"]{--tc:var(--neon-cyan);--tcb:rgba(103,232,249,.45)}
.toast__icon{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;
  color:#0B0A1F;background:var(--tc);box-shadow:0 0 16px -2px var(--tc)}
.toast__icon::before{content:attr(data-glyph)}
@keyframes toastIn{from{transform:translateY(18px) scale(.86);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes toastOut{to{transform:translateY(-6px) scale(.97);opacity:0}}

/* ── 12. MODAL DE RESULTADO ────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal__scrim{position:absolute;inset:0;background:rgba(5,4,18,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal__card{position:relative;overflow:hidden;width:min(100%,430px);padding:30px 26px 24px;border-radius:26px;text-align:center;
  background:linear-gradient(180deg,rgba(32,26,72,.96),rgba(12,10,32,.98));
  border:1px solid rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 1px rgba(217,70,239,.3),0 0 70px -18px var(--magenta),0 40px 90px -40px #000;
  animation:cardIn .55s var(--ease-spring) both}
@keyframes cardIn{from{transform:translateY(26px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal__card::before{content:'';position:absolute;inset:-40% -10% auto;height:70%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(217,70,239,.35),transparent 68%)}
.modal__badge{position:relative;width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  font-size:30px;font-weight:900;color:#0B0A1F;
  background:linear-gradient(160deg,#86EFAC,var(--neon-green) 55%,rgba(34,197,94,.5));
  box-shadow:0 0 0 6px rgba(34,197,94,.14),0 0 40px -6px var(--neon-green);animation:badgePop .7s var(--ease-spring) .18s both}
@keyframes badgePop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.modal__badge[data-tone="lose"]{background:linear-gradient(160deg,#B8C4D8,var(--neon-cold) 55%,rgba(140,163,196,.4));
  box-shadow:0 0 0 6px rgba(140,163,196,.12),0 0 34px -10px var(--neon-cold)}
.modal h2{position:relative;margin:0 0 8px;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,7.4vw,34px);
  letter-spacing:-.04em;line-height:1.02;
  background:linear-gradient(94deg,#FFF7ED,var(--neon-yellow) 40%,var(--pink) 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(217,70,239,.4))}
.modal h2[data-tone="lose"]{background:linear-gradient(94deg,#E2E8F0,#94A3B8 55%,var(--magenta));-webkit-background-clip:text;background-clip:text}
.modal p{position:relative;margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.reveal-word{position:relative;display:inline-flex;gap:5px;margin:0 0 18px;padding:10px 14px;border-radius:12px;
  background:rgba(0,0,0,.36);border:1px solid var(--hair)}
.reveal-word b{font-family:var(--f-display);font-size:22px;font-weight:900;color:var(--neon-cyan);
  text-shadow:0 0 14px rgba(103,232,249,.7)}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 18px}
.stats div{padding:11px 6px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.stats dt{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.stats dd{margin:5px 0 0;font-family:var(--f-display);font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.modal__actions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sharebox{position:relative;margin:16px 0 0;text-align:left}
.sharebox summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:9px;padding:0 15px;border-radius:12px;
  font-size:12.5px;font-weight:700;color:var(--ink-3);background:rgba(255,255,255,.04);border:1px solid var(--hair);
  list-style:none}
.sharebox summary::-webkit-details-marker{display:none}
.sharebox summary::before{content:'▸';color:var(--magenta);transition:transform .25s}
.sharebox[open] summary::before{transform:rotate(90deg)}
.sharebox pre{margin:10px 0 0;padding:14px;border-radius:12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;
  color:var(--ink);white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.45);border:1px solid var(--hair);text-align:left}

/* ── 13. CONFETE (partículas CSS puro, geradas no JS) ──────────────────── */
.confetti{position:fixed;inset:0;z-index:88;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-8vh;left:var(--x);width:var(--w);height:calc(var(--w) * 1.7);border-radius:2px;
  background:var(--c);opacity:0;
  animation:fall var(--dur) cubic-bezier(.22,.55,.35,1) var(--delay) both;
  box-shadow:0 0 12px -2px var(--c)}
.confetti i.round{border-radius:50%;height:var(--w);width:var(--w)}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}
  8%{opacity:1}
  70%{opacity:.95}
  100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:0}
}
/* detritos "de vidro": quadradinhos menores com blur */
.confetti i.shard{height:5px;width:5px;border-radius:1px;filter:blur(.4px)}

/* ── 14. MODO ALTO CONTRASTE ───────────────────────────────────────────── */
/* Não é um "light mode": é o mesmo elétrico com mais separação entre camadas. */
body.hc{--glass:rgba(255,255,255,.10);--hair:rgba(255,255,255,.34);--ink-3:#C4BEE6}
body.hc .aurora{opacity:.42}
body.hc .bg__grid{display:none}
body.hc .tile{box-shadow:inset 0 0 0 3px rgba(255,255,255,.30)}
body.hc .tile[data-state="filled"]{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
body.hc .tile[data-state="correct"]{box-shadow:inset 0 0 0 4px var(--neon-green),0 0 0 3px #0B0A1F}
body.hc .tile[data-state="present"]{box-shadow:inset 0 0 0 3px var(--neon-yellow),inset 0 0 0 7px rgba(234,179,8,.45)}
body.hc .tile[data-state="absent"]{background:#2A3145;box-shadow:inset 0 0 0 3px #93A6C2}
body.hc .tile[data-state="absent"] .tile__glyph{color:#E2E8F0}
body.hc .key{border-color:rgba(255,255,255,.40);background:rgba(255,255,255,.14)}
body.hc .key[data-state="absent"]{background:#2A3145;border-color:#93A6C2;opacity:1;color:#E2E8F0}
body.hc .hud__status,body.hc .brand h1 span{color:var(--ink)}
body.hc :focus-visible{outline-width:4px}

/* ── 15. RESPONSIVO ────────────────────────────────────────────────────── */
@media (min-width:720px){
  .stage{padding-top:26px;gap:20px}
  .hud{max-width:420px;padding:14px 20px}
  .board{--tile:62px}
  .kb{max-width:500px}
  .powers{max-width:420px}
}
@media (max-width:379px){
  .powers{grid-template-columns:1fr}
  .power{min-height:52px}
  /* HUD aperta: tracking menor evita "5 LETRAS · 6 / TENTATIVAS" em 2 linhas */
  .hud{gap:11px;padding:11px 12px}
  .hud__label{font-size:9.5px;letter-spacing:.12em}
  .hud__status{font-size:13.5px}
  .hud__time{font-size:13px;padding:6px 8px}
}

/* ── 16. PREFERÊNCIAS DE MOVIMENTO REDUZIDO ────────────────────────────── */
/* Regra dura: sem cascata, sem pulse, sem confete, sem flutuação de aurora. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .aurora,.energy__shine,.bulb.is-on .bulb__rays,.bulb.is-on .bulb__glass,
  .power.is-ready,.tile__glyph,.modal__badge,.toast__icon{animation:none !important}
  .tile.flip,.tile.flip::after,.tile.flip .tile__glyph{animation:none !important}
  .tile.flip::after{opacity:0 !important}
  .row.is-bad{animation:none !important}
  .btn:hover,.chip:hover,.power:hover:not(:disabled){transform:none}
}
</style>
</head>
<body>

<!-- Camadas de fundo puras em CSS -->
<div class="bg" aria-hidden="true">
  <div class="aurora aurora--v"></div>
  <div class="aurora aurora--m"></div>
  <div class="aurora aurora--p"></div>
  <div class="bg__grid"></div>
  <div class="bg__vignette"></div>
</div>

<!-- ═══ DETALHE ASSINATURA #1: barra de energia no topo ═══ -->
<div class="energy" id="energy" role="progressbar" aria-label="Progresso da partida: tentativas usadas"
     aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" aria-valuetext="0 de 6 tentativas usadas">
  <div class="energy__fill" id="energyFill"><span class="energy__shine"></span></div>
  <div class="energy__ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<main class="stage">

  <header class="brand">
    <div class="bolt" aria-hidden="true"></div>
    <h1>ADIVINHA<span>PALAVRA</span></h1>
    <div class="tools">
      <button class="chip" id="btnHC" type="button" aria-pressed="false" title="Alternar alto contraste">
        <span class="chip__dot" aria-hidden="true"></span>Contraste
      </button>
    </div>
  </header>

  <!-- ═══ MASCOTE: lâmpada que acende com o progresso ═══ -->
  <section class="hud" aria-hidden="true">
    <div class="bulb" id="bulb">
      <span class="bulb__halo"></span>
      <span class="bulb__rays">
        <i style="--r:-60deg"></i><i style="--r:-20deg"></i><i style="--r:20deg"></i>
        <i style="--r:60deg"></i><i style="--r:-95deg"></i><i style="--r:95deg"></i>
      </span>
      <div class="bulb__glass"><span class="bulb__fil"></span></div>
      <div class="bulb__neck"></div>
      <div class="bulb__base"></div>
    </div>
    <div class="hud__read">
      <p class="hud__label">5 letras · 6 tentativas</p>
      <p class="hud__status" id="hudStatus">Acenda a lâmpada. <em>6</em> cargas.</p>
    </div>
    <div class="hud__time" id="hudTime">0:00</div>
  </section>

  <!-- ═══ GRADE ═══ -->
  <div class="board" id="board" role="grid" aria-label="Grade de tentativas, 5 letras e 6 linhas"
       aria-rowcount="6" aria-colcount="5"></div>

  <!-- ═══ PODERES ═══ -->
  <section class="powers" aria-label="Poderes da partida">
    <button class="power is-ready" id="pReveal" type="button" data-power="reveal">
      <span class="power__icon power__icon--eye" aria-hidden="true"></span>
      <span class="power__txt"><b>Revelar</b><small>Preenche a próxima letra</small></span>
      <span class="power__badge" aria-hidden="true">ALT+R</span>
    </button>
    <button class="power is-ready" id="pEliminate" type="button" data-power="eliminate">
      <span class="power__icon power__icon--ban" aria-hidden="true"></span>
      <span class="power__txt"><b>Eliminar</b><small>Corta 2 letras do teclado</small></span>
      <span class="power__badge" aria-hidden="true">ALT+E</span>
    </button>
  </section>

  <!-- ═══ TECLADO VIRTUAL ═══ -->
  <div class="kb" id="kb" role="group" aria-label="Teclado virtual — use também o teclado físico"></div>
</main>

<!-- Canal de anúncios para leitores de tela -->
<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- ═══ TOASTS ═══ -->
<div class="toasts" id="toasts" aria-hidden="true"></div>

<!-- ═══ MODAL DE RESULTADO ═══ -->
<div class="modal" id="modal" hidden>
  <div class="modal__scrim"></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mDesc" tabindex="-1">
    <div class="modal__badge" id="mBadge" data-tone="win" aria-hidden="true">✓</div>
    <h2 id="mTitle">Circuito fechado</h2>
    <p id="mDesc">A palavra acendeu na sua cabeça.</p>
    <div class="reveal-word" id="mWord" hidden></div>
    <dl class="stats">
      <div><dt>Tentativas</dt><dd id="mTries">—</dd></div>
      <div><dt>Tempo</dt><dd id="mTime">—</dd></div>
      <div><dt>Poderes</dt><dd id="mPowers">—</dd></div>
    </dl>
    <div class="modal__actions">
      <button class="btn btn--primary" id="btnShare" type="button">Compartilhar</button>
      <button class="btn btn--ghost" id="btnRestart" type="button">Reiniciar</button>
    </div>
    <details class="sharebox" id="shareBox">
      <summary>Ver texto para copiar (sem spoiler)</summary>
      <pre id="shareText"></pre>
    </details>
  </div>
</div>

<!-- Dicionário compartilhado entre os protótipos: fonte única de verdade,
     curada com ~14,5 mil palavras portuguesas de 5 letras. Mantenha este
     arquivo ao lado do HTML — sem ele o jogo cai na lista mínima de fallback. -->
<script src="dicionario.js"></script>
<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   DOM E CONSTANTES
   ══════════════════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
let TARGET   = 'TERMO';
const N        = 5;
const MAX      = 6;
/* Tentativas válidas: dicionario.js é a fonte única dos três protótipos
   (~14,5 mil palavras de 5 letras). O fallback mantém o jogo funcionando
   caso o HTML seja aberto sem o dicionario.js ao lado. */
const FALLBACK = new Set(['CRANE','STARE','ADIEU','RAISE','SLATE','TERMO','MENTE','PEDRA','NUVEM','FLORE','BARCO','CASAS','TROCA','NOTAS']);
const ACCEPTED = (window.DICIONARIO_PT5 && window.DICIONARIO_PT5.size > 1000)
  ? window.DICIONARIO_PT5
  : FALLBACK;

/* Palavra-alvo: subconjunto curado do dicionário compartilhado (~1,7 mil
   palavras comuns), sorteado a cada reinício. `ultimoAlvo` impede repetir a
   palavra da partida anterior. */
const RESPOSTAS = (window.DICIONARIO_RESPOSTAS && window.DICIONARIO_RESPOSTAS.length)
  ? window.DICIONARIO_RESPOSTAS : [...FALLBACK];
let ultimoAlvo = null;
function sortearAlvo(){
  if (RESPOSTAS.length < 2) return RESPOSTAS[0] || 'TERMO';
  let novo;
  do { novo = RESPOSTAS[Math.floor(Math.random() * RESPOSTAS.length)]; }
  while (novo === ultimoAlvo);
  ultimoAlvo = novo;
  return novo;
}
const ALPHA    = 'QWERTYUIOPASDFGHJKLZXCVBNM';
const ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

const el = {
  board: $('#board'), kb: $('#kb'), live: $('#live'), toasts: $('#toasts'),
  bulb: $('#bulb'), status: $('#hudStatus'), time: $('#hudTime'),
  energy: $('#energy'), fill: $('#energyFill'), confetti: $('#confetti'),
  pReveal: $('#pReveal'), pElim: $('#pEliminate'), btnHC: $('#btnHC'),
  modal: $('#modal'), mTitle: $('#mTitle'), mDesc: $('#mDesc'), mBadge: $('#mBadge'),
  mWord: $('#mWord'), mTries: $('#mTries'), mTime: $('#mTime'), mPowers: $('#mPowers'),
  btnShare: $('#btnShare'), btnRestart: $('#btnRestart'),
  shareBox: $('#shareBox'), shareText: $('#shareText')
};

/* prefers-reduced-motion é lido em JS porque precisamos *não gerar* o confete,
   não apenas escondê-lo — evita trabalho inútil e picos de CPU/GPU. */
const rmQuery = matchMedia('(prefers-reduced-motion: reduce)');
let REDUCED = rmQuery.matches;
rmQuery.addEventListener?.('change', e => { REDUCED = e.matches; });

/* ══════════════════════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════════════════════ */
let S;
function freshState(){
  return {
    row: 0,                       // próxima linha a ser preenchida
    buf: ['', '', '', '', ''],    // palpite em edição
    locked: [false,false,false,false,false], // posições travadas pelo poder Revelar
    rows: [],                    // linhas confirmadas: {word, res}
    kb: {},                      // estado por letra no teclado
    powers: { reveal: false, eliminate: false },
    over: false, won: false,
    t0: Date.now(), elapsed: 0,
    kbTimer: 0, cellTimer: 0
  };
}

const RANKS = { absent: 1, present: 2, correct: 3 };
const WORD_STATES = ['empty','filled','correct','present','absent'];
const NAMES = { correct: 'na posição correta', present: 'presente na palavra, em outra posição', absent: 'ausente da palavra', filled: 'preenchida', empty: 'vazia' };

/* ══════════════════════════════════════════════════════════════════════════
   ALGORITMO DE FEEDBACK (2 passos — PRD §4.1)
   Passo 1: marca todos os "correct" e consome do contador.
   Passo 2: só então distribui "present" usando o que sobrou.
   Isso é o que faz "ERREO" contra "TERMO" devolver P,C,P,C em vez de P,C,A,P.
   ══════════════════════════════════════════════════════════════════════════ */
function evaluate(guess, target){
  const res = Array(target.length).fill('absent');
  const pool = Object.create(null);
  for (const ch of target) pool[ch] = (pool[ch] || 0) + 1;      // passo 1: verdes
  for (let i = 0; i < target.length; i++){
    if (guess[i] === target[i]){ res[i] = 'correct'; pool[target[i]]--; }
  }
  for (let i = 0; i < target.length; i++){                     // passo 2: amarelos
    if (res[i] !== 'correct' && (pool[guess[i]] || 0) > 0){
      res[i] = 'present'; pool[guess[i]]--;
    }
  }
  return res;
}

/* Normalização ABNT2 → ASCII: teclado físico pode mandar Ç, Á, Ê… */
function normalize(s){
  return s.toUpperCase()
    .replace(/Ç/g, 'C')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Z]/g, '');
}

/* ══════════════════════════════════════════════════════════════════════════
   CONSTRUÇÃO DA GRADE
   ══════════════════════════════════════════════════════════════════════════ */
const rowsEl = [], tilesEl = [];
for (let r = 0; r < MAX; r++){
  const row = document.createElement('div');
  row.className = 'row';
  row.setAttribute('role', 'row');
  row.setAttribute('aria-rowindex', String(r + 1));
  const cells = [];
  for (let c = 0; c < N; c++){
    const t = document.createElement('div');
    t.className = 'tile';
    t.setAttribute('role', 'gridcell');
    t.setAttribute('aria-colindex', String(c + 1));
    const g = document.createElement('span');
    g.className = 'tile__glyph';
    const m = document.createElement('span');
    m.className = 'tile__mark';
    m.setAttribute('aria-hidden', 'true');
    t.append(g, m);
    row.append(t);
    cells.push(t);
  }
  rowsEl.push(row); tilesEl.push(cells);
  el.board.append(row);
}

/* ══════════════════════════════════════════════════════════════════════════
   CONSTRUÇÃO DO TECLADO
   ══════════════════════════════════════════════════════════════════════════ */
const keyEl = Object.create(null);
ROWS.forEach((line, ri) => {
  const row = document.createElement('div');
  row.className = 'kb__row';
  if (ri === 2){
    row.append(mkKey('ENTER', 'ENTER', 'Enter para enviar', true));
  }
  for (const ch of line) row.append(mkKey(ch, ch, `Letra ${ch}`, false));
  if (ri === 2) row.append(mkKey('⌫', 'BACK', 'Apagar letra', true));
  el.kb.append(row);
});

function mkKey(label, code, aria, wide){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'key' + (wide ? ' key--wide' : '');
  b.textContent = label;
  b.dataset.code = code;
  b.setAttribute('aria-label', aria);
  keyEl[code] = b;
  return b;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════════ */
function describeTile(t, row, col, letter, state){
  const pos = `Linha ${row + 1}, posição ${col + 1}`;
  const ch  = letter ? `letra ${letter}, ` : 'vazia, ';
  t.setAttribute('aria-label', `${pos}, ${ch}${NAMES[state] || state}`);
}

function paintRow(r){
  if (r >= MAX || !tilesEl[r]) return;   // guarda: setTimeout pode rodar pós-fim/reinício
  const isCur = (r === S.row && !S.over);
  for (let c = 0; c < N; c++){
    const t = tilesEl[r][c];
    const confirmed = S.rows[r];
    const letter = confirmed ? confirmed.word[c] : (isCur ? S.buf[c] : '');
    const state = confirmed
      ? confirmed.res[c]
      : (letter ? 'filled' : 'empty');
    t.dataset.state = state;
    t.querySelector('.tile__glyph').textContent = letter;
    t.querySelector('.tile__mark').textContent =
      state === 'correct' ? '✓' : state === 'present' ? '~' : state === 'absent' ? '✕' : '';
    t.classList.toggle('is-locked', !!S.locked[c] && isCur);
    describeTile(t, r, c, letter, state);
  }
}
function paintAll(){ for (let r = 0; r < MAX; r++) paintRow(r); }

function paintKeyboard(){
  for (const ch of ALPHA){
    const k = keyEl[ch], st = S.kb[ch];
    if (st){ k.dataset.state = st; }
    else { delete k.dataset.state; }
    k.setAttribute('aria-label', `Letra ${ch}${st ? ', ' + NAMES[st] : ''}`);
  }
  const disabled = S.over;
  el.kb.querySelectorAll('.key').forEach(k => { k.disabled = disabled; });
}

function setCharge(v, max){
  el.fill.style.setProperty('--charge', (v / max * 100).toFixed(2) + '%');
  el.energy.setAttribute('aria-valuenow', String(v));
  el.energy.setAttribute('aria-valuetext', `${v} de ${max} tentativas usadas`);
  /* A lâmpada consome a MESMA métrica da barra: assinatura coesa. */
  if (!S.over) el.bulb.style.setProperty('--charge', (v / max).toFixed(3));
}

function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function announce(msg){ el.live.textContent = msg; }

function setStatus(html){ el.status.innerHTML = html; }

/* ══════════════════════════════════════════════════════════════════════════
   TOASTS (subem com spring; ícone + texto — nunca só cor)
   ══════════════════════════════════════════════════════════════════════════ */
const GLYPH = { error: '!', success: '✓', info: 'i' };
function toast(kind, msg, life = 2600){
  const t = document.createElement('div');
  t.className = 'toast';
  t.dataset.kind = kind;
  t.style.setProperty('--life', life + 'ms');
  t.innerHTML = `<span class="toast__icon" data-glyph="${GLYPH[kind]}" aria-hidden="true"></span><span></span>`;
  t.lastElementChild.textContent = msg;
  el.toasts.append(t);
  setTimeout(() => t.remove(), life + 420);
  announce(msg);
}

/* ══════════════════════════════════════════════════════════════════════════
   RIPPLE (toque/click)
   ══════════════════════════════════════════════════════════════════════════ */
function ripple(btn, ev){
  if (REDUCED) return;
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.1;
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `left:${(ev.clientX || r.left + r.width / 2) - r.left - size / 2}px;top:${(ev.clientY || r.top + r.height / 2) - r.top - size / 2}px;width:${size}px;height:${size}px`;
  btn.append(s);
  setTimeout(() => s.remove(), 650);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest?.('.btn, .chip, .power');
  if (b && !b.disabled) ripple(b, e);
});

/* ══════════════════════════════════════════════════════════════════════════
   ENTRADA
   ══════════════════════════════════════════════════════════════════════════ */
function typeLetter(ch){
  if (S.over) return;
  for (let i = 0; i < N; i++){
    if (!S.locked[i] && !S.buf[i]){ S.buf[i] = ch; paintRow(S.row); return; }
  }
}

function backspace(){
  if (S.over) return;
  for (let i = N - 1; i >= 0; i--){
    if (S.locked[i]) continue;
    if (S.buf[i]){ S.buf[i] = ''; paintRow(S.row); return; }
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   ENVIAR TENTATIVA
   ══════════════════════════════════════════════════════════════════════════ */
function submit(){
  if (S.over) return;
  const word = S.buf.join('');
  const row  = rowsEl[S.row];

  if (word.length !== N){
    reject(row, `Faltam ${N - word.length} letra${N - word.length > 1 ? 's' : ''}.`);
    return;
  }
  if (!ACCEPTED.has(word)){
    reject(row, `“${word}” não está no dicionário.`);
    return;
  }

  const res = evaluate(word, TARGET);
  S.rows[S.row] = { word, res };
  const used = S.row + 1;

  /* Cascata: --d escalona o flip e o véu em 80ms por letra (assinatura). */
  tilesEl[S.row].forEach((t, i) => {
    t.dataset.state = res[i];
    t.querySelector('.tile__glyph').textContent = word[i];
    t.querySelector('.tile__mark').textContent = res[i] === 'correct' ? '✓' : res[i] === 'present' ? '~' : '✕';
    describeTile(t, S.row, i, word[i], res[i]);
    if (!REDUCED){ t.style.setProperty('--d', (i * 80) + 'ms'); t.classList.add('flip'); }
  });
  rowsEl[S.row].removeAttribute('aria-hidden');

  /* Teclado acompanha o reveal — pequeno atraso para não "vender" a dica antes. */
  clearTimeout(S.kbTimer);
  S.kbTimer = setTimeout(() => {
    /* Estado da tecla = MELHOR feedback entre todas as ocorrencias da letra na tentativa. */
    const bestByLetter = {};
    for (let i = 0; i < word.length; i++) {
      const ch = word[i];
      const st = res[i];
      if (!(ch in bestByLetter) || (RANKS[st] || 0) > (RANKS[bestByLetter[ch]] || 0)) bestByLetter[ch] = st;
    }
    for (const ch of Object.keys(bestByLetter)) setKey(ch, bestByLetter[ch]);
    paintKeyboard();
  }, REDUCED ? 0 : 430);

  const c = res.filter(x => x === 'correct').length;
  const p = res.filter(x => x === 'present').length;
  announce(`Linha ${used} de ${MAX}: ${word}. ${c} letra(s) na posição correta, ${p} presente(s), ${N - c - p} ausente(s).`);
  setStatus(c === N
    ? '<em>Circuito completo.</em>'
    : `${c} <em>no lugar</em> · ${p} presente${p === 1 ? '' : 's'} · ${N - c - p} fora`);

  setCharge(used, MAX);
  S.row++;

  if (c === N){ finish(true); return; }
  if (S.row >= MAX){ finish(false); return; }
  S.buf = ['','','','','']; S.locked = [false,false,false,false,false];
  /* Captura a linha AGORA. Ler `S.row` dentro do callback usaria o valor
     no momento do disparo — se o jogador enviar outra tentativa antes,
     repintaríamos a linha errada (ou uma linha inexistente). */
  const nextRow = S.row;
  clearTimeout(S.cellTimer);
  S.cellTimer = setTimeout(() => paintRow(nextRow), REDUCED ? 0 : 460);
}

function reject(row, msg){
  if (!REDUCED){ row.classList.remove('is-bad'); void row.offsetWidth; row.classList.add('is-bad'); }
  row.querySelectorAll('.tile').forEach(t => {
    if (!REDUCED) t.animate(
      [{ filter:'brightness(1)' }, { filter:'brightness(1.8)' }, { filter:'brightness(1)' }],
      { duration: 260, easing: 'ease-out' }
    );
  });
  toast('error', msg);
}

/* ══════════════════════════════════════════════════════════════════════════
   TECLADO MONOTÔNICO (nunca regride — PRD §4.2)
   ══════════════════════════════════════════════════════════════════════════ */
function setKey(ch, st){
  if ((RANKS[st] || 0) > (RANKS[S.kb[ch]] || 0)) S.kb[ch] = st;
}

/* ══════════════════════════════════════════════════════════════════════════
   PODERES
   ══════════════════════════════════════════════════════════════════════════ */
function useReveal(){
  if (S.over || S.powers.reveal) return;
  let idx = -1;
  for (let i = 0; i < N; i++){
    if (S.locked[i]) continue;
    if (S.buf[i] === TARGET[i]) continue;   // já está certa sozinha
    idx = i; break;
  }
  if (idx < 0){ toast('info', 'Nada a revelar nesta linha.'); return; }
  S.buf[idx] = TARGET[idx];
  S.locked[idx] = true;
  S.powers.reveal = true;
  paintRow(S.row);
  el.pReveal.classList.remove('is-ready');
  el.pReveal.classList.add('is-spent');
  el.pReveal.disabled = true;
  el.pReveal.querySelector('small').textContent = 'Usado';
  const t = tilesEl[S.row][idx];
  if (!REDUCED) t.animate([{ transform:'scale(1)' }, { transform:'scale(1.16)' }, { transform:'scale(1)' }],
    { duration: 480, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  toast('success', `Letra ${TARGET[idx]} revelada na posição ${idx + 1}.`);
  setStatus(`Letra <em>${TARGET[idx]}</em> travada na posição ${idx + 1}.`);
}

function useEliminate(){
  if (S.over || S.powers.eliminate) return;
  const inTarget = new Set(TARGET.split(''));
  const tried = new Set(S.rows.flatMap(r => r.word.split('')));
  const pool = ALPHA.split('').filter(ch => !inTarget.has(ch) && S.kb[ch] !== 'absent' && !keyEl[ch].classList.contains('is-eliminated'));
  /* Prioriza letras que o jogador NUNCA usou: o poder informa algo novo. */
  pool.sort((a, b) => (tried.has(a) ? 1 : 0) - (tried.has(b) ? 1 : 0));
  const pick = pool.slice(0, 2);
  if (!pick.length){ toast('info', 'Não há letras para eliminar.'); return; }
  pick.forEach(ch => { setKey(ch, 'absent'); keyEl[ch].classList.add('is-eliminated'); });
  S.powers.eliminate = true;
  paintKeyboard();
  el.pElim.classList.remove('is-ready');
  el.pElim.classList.add('is-spent');
  el.pElim.disabled = true;
  el.pElim.querySelector('small').textContent = 'Usado';
  toast('success', `${pick.join(' e ')} eliminada${pick.length > 1 ? 's' : ''} do teclado.`);
  announce(`${pick.join(' e ')} ${pick.length > 1 ? 'foram eliminadas' : 'foi eliminada'} do teclado.`);
}

el.pReveal.addEventListener('click', useReveal);
el.pElim.addEventListener('click', useEliminate);

/* ══════════════════════════════════════════════════════════════════════════
   FIM DE PARTIDA
   ══════════════════════════════════════════════════════════════════════════ */
function finish(won){
  S.over = true; S.won = won;
  clearTimeout(S.kbTimer);
  S.elapsed = Date.now() - S.t0;
  el.time.textContent = fmtTime(S.elapsed);
  paintKeyboard();
  el.pReveal.disabled = true; el.pElim.disabled = true;
  el.pReveal.classList.remove('is-ready'); el.pElim.classList.remove('is-ready');

  if (won){
    el.bulb.classList.add('is-on');
    setCharge(MAX, MAX);
    setStatus('<em>Energia máxima.</em> Circuito fechado.');
    if (!REDUCED) burst();
    openModal(true);
  } else {
    el.bulb.classList.add('is-off');
    el.bulb.style.setProperty('--charge', '0');
    el.fill.style.setProperty('--charge', '0%');
    el.energy.setAttribute('aria-valuenow', '0');
    el.energy.setAttribute('aria-valuetext', '0 de 6 tentativas usadas');
    setStatus('Circuito aberto. <em>A palavra era ' + TARGET + '.</em>');
    openModal(false);
  }
  announce(won
    ? `Vitória! A palavra ${TARGET} foi descoberta em ${S.rows.length} tentativa(s), em ${fmtTime(S.elapsed)}.`
    : `Fim das tentativas. A palavra era ${TARGET}.`);
}

/* ══════════════════════════════════════════════════════════════════════════
   CONFETE (assinatura #2) — partículas CSS, seedadas pelo JS
   ══════════════════════════════════════════════════════════════════════════ */
const CONFETTI_COLORS = ['#22C55E', '#EAB308', '#D946EF', '#EC4899', '#7C3AED', '#67E8F9', '#FFF7ED'];
function burst(){
  const n = 64;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    const kind = i % 9 === 0 ? 'round' : (i % 7 === 0 ? 'shard' : '');
    if (kind) p.className = kind;
    p.style.cssText =
      `--x:${(Math.random() * 100).toFixed(2)}%;` +
      `--dx:${(Math.random() * 32 - 16).toFixed(1)}vw;` +
      `--rot:${Math.round(Math.random() * 1440 - 720)}deg;` +
      `--w:${(Math.random() * 7 + 4).toFixed(1)}px;` +
      `--dur:${(Math.random() * 1.5 + 2.2).toFixed(2)}s;` +
      `--delay:${(Math.random() * 0.85).toFixed(2)}s;` +
      `--c:${CONFETTI_COLORS[i % CONFETTI_COLORS.length]}`;
    frag.append(p);
  }
  el.confetti.append(frag);
  setTimeout(() => { el.confetti.replaceChildren(); }, 5200);
}

/* ══════════════════════════════════════════════════════════════════════════
   COMPARTILHAR SEM SPOILER (PRD §7)
   ══════════════════════════════════════════════════════════════════════════ */
function shareText(){
  const hc = document.body.classList.contains('hc');
  const g = { correct: hc ? '■' : '🟩', present: hc ? '◼' : '🟨', absent: hc ? '□' : '⬜' };
  const tries = S.rows.length;
  /* S.won (e não a variável local `won`) — shareText() é chamada de fora do fluxo
     de finish(), então precisa ler o estado persistido, não um parâmetro. */
  const head = S.won
    ? `Adivinha Palavra · Elétrico — ${tries}/${MAX} em ${fmtTime(S.elapsed)}`
    : `Adivinha Palavra · Elétrico — X/${MAX} (não veio hoje)`;
  const grid = S.rows.map(r => r.res.map(s => g[s]).join('')).join('\n');
  const legend = hc
    ? '■ correta · ◼ presente · □ ausente'
    : '🟩 correta · 🟨 presente · ⬜ ausente';
  return `${head}\n\n${grid}\n\n${legend}\nhttps://adivinha.app`;
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (_) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.append(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (_) { return false; }
}

el.btnShare.addEventListener('click', async () => {
  const t = shareText();
  el.shareText.textContent = t;
  const ok = await copyText(t);
  if (ok){
    toast('success', 'Resultado copiado — sem spoiler.');
    el.btnShare.textContent = 'Copiado!';
    setTimeout(() => { el.btnShare.textContent = 'Compartilhar'; }, 1800);
  } else {
    el.shareBox.open = true;
    toast('error', 'Não consegui copiar. Abra o texto abaixo.');
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   MODAL (foco preso, Esc fecha, foco volta ao gatilho)
   ══════════════════════════════════════════════════════════════════════════ */
let lastFocus = null;
function openModal(won){
  lastFocus = document.activeElement;
  el.mBadge.dataset.tone = won ? 'win' : 'lose';
  el.mBadge.textContent = won ? '✓' : '✕';
  el.mTitle.textContent = won ? 'Circuito fechado' : 'Circuito aberto';
  el.mTitle.dataset.tone = won ? 'win' : 'lose';
  el.mDesc.textContent = won
    ? `A lâmpada acendeu inteira em ${S.rows.length} tentativa${S.rows.length > 1 ? 's' : ''}.`
    : `As ${MAX} cargas acabaram. A palavra estava ali o tempo todo.`;
  el.mTries.textContent = won ? S.rows.length : MAX;
  el.mTime.textContent  = fmtTime(S.elapsed);
  el.mPowers.textContent = (S.powers.reveal ? 1 : 0) + (S.powers.eliminate ? 1 : 0) + '/2';
  if (!won){
    el.mWord.hidden = false;
    el.mWord.replaceChildren(...[...TARGET].map(ch => { const b = document.createElement('b'); b.textContent = ch; return b; }));
  } else {
    el.mWord.hidden = true;
  }
  el.shareText.textContent = shareText();
  el.modal.hidden = false;
  requestAnimationFrame(() => el.btnRestart.focus());
}
function closeModal(){ el.modal.hidden = true; lastFocus?.focus?.(); }
el.modal.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeModal(); return; }
  if (e.key !== 'Tab') return;
  const f = [...el.modal.querySelectorAll('button, summary, [tabindex]:not([tabindex="-1"])')]
    .filter(n => n.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
$('#modal').querySelector('.modal__scrim').addEventListener('click', closeModal);

/* ══════════════════════════════════════════════════════════════════════════
   REINICIAR
   ══════════════════════════════════════════════════════════════════════════ */
function reset(){
  clearTimeout(S.kbTimer);
  clearTimeout(S.cellTimer);
  closeModal();
  TARGET = sortearAlvo();
  S = freshState();
  el.bulb.className = 'bulb';
  el.bulb.style.setProperty('--charge', '0');
  el.confetti.replaceChildren();
  el.toasts.replaceChildren();
  rowsEl.forEach(r => { r.classList.remove('is-bad'); });
  tilesEl.flat().forEach(t => { t.classList.remove('flip'); t.style.removeProperty('--d'); t.classList.remove('is-locked'); });
  Object.values(keyEl).forEach(k => { k.classList.remove('is-eliminated'); delete k.dataset.state; k.disabled = false; });
  el.pReveal.classList.remove('is-spent'); el.pReveal.disabled = false;
  el.pElim.classList.remove('is-spent'); el.pElim.disabled = false;
  el.pReveal.querySelector('small').textContent = 'Preenche a próxima letra';
  el.pElim.querySelector('small').textContent = 'Corta 2 letras do teclado';
  el.pReveal.classList.add('is-ready'); el.pElim.classList.add('is-ready');
  el.shareBox.open = false;
  setCharge(0, MAX);
  setStatus('Acenda a lâmpada. <em>6</em> cargas.');
  el.time.textContent = '0:00';
  paintAll(); paintKeyboard();
  announce('Nova partida: nova palavra sorteada. Palavra de 5 letras, 6 tentativas. Poderes disponíveis: Revelar e Eliminar.');
  keyEl['ENTER']?.focus?.();
}
el.btnRestart.addEventListener('click', reset);

/* ══════════════════════════════════════════════════════════════════════════
   ENTRADA: TECLADO VIRTUAL
   ══════════════════════════════════════════════════════════════════════════ */
el.kb.addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (!k || k.disabled) return;
  const code = k.dataset.code;
  if (code === 'ENTER') submit();
  else if (code === 'BACK') backspace();
  else typeLetter(code);
});

/* ══════════════════════════════════════════════════════════════════════════
   ENTRADA: TECLADO FÍSICO
   ══════════════════════════════════════════════════════════════════════════ */
window.addEventListener('keydown', e => {
  if (!el.modal.hidden){ return; }              // modal tem seu próprio teclado
  if (e.ctrlKey && !e.altKey) return;           // deixa atalhos do navegador
  if (e.metaKey) return;

  /* Atalhos dos poderes com Alt (sem colidir com as letras R/E). */
  if (e.altKey){
    const k = e.key.toLowerCase();
    if (k === 'r'){ e.preventDefault(); useReveal(); return; }
    if (k === 'e'){ e.preventDefault(); useEliminate(); return; }
    return;
  }

  if (e.key === 'Enter'){
    /* Se o foco está num botão, o clique dele já faz a ação. */
    if (e.target instanceof HTMLElement && e.target.closest('button')) return;
    e.preventDefault(); submit(); return;
  }
  if (e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
  if (e.key === 'Escape'){ if (!el.modal.hidden) closeModal(); return; }
  if (e.key.length === 1){
    const ch = normalize(e.key);
    if (ch){ e.preventDefault(); typeLetter(ch); }
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   ALTO CONTRASTE (PRD §8) — preference local, sem servidor
   ══════════════════════════════════════════════════════════════════════════ */
let hc = false;
try { hc = localStorage.getItem('ap:proto-hc') === '1'; } catch (_) {}
function applyHC(){
  document.body.classList.toggle('hc', hc);
  el.btnHC.setAttribute('aria-pressed', String(hc));
  try { localStorage.setItem('ap:proto-hc', hc ? '1' : '0'); } catch (_) {}
}
el.btnHC.addEventListener('click', () => { hc = !hc; applyHC(); toast('info', hc ? 'Alto contraste ativado.' : 'Alto contraste desativado.'); });

/* ══════════════════════════════════════════════════════════════════════════
   CRONÔMETRO
   ══════════════════════════════════════════════════════════════════════════ */
setInterval(() => {
  if (S.over) return;
  S.elapsed = Date.now() - S.t0;
  el.time.textContent = fmtTime(S.elapsed);
}, 1000);

/* ══════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════ */
applyHC();
TARGET = sortearAlvo();
S = freshState();
paintAll();
paintKeyboard();
setCharge(0, MAX);
setStatus('Acenda a lâmpada. <em>6</em> cargas.');
announce('Adivinha Palavra. Palavra alvo de 5 letras, 6 tentativas. Use o teclado físico ou o teclado virtual na tela.');

})();
</script>
